<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-label="Campus buildings with students">
  <!-- sky panel -->
  <rect x="10" y="10" width="460" height="300" rx="24" fill="#ffffff" fill-opacity="0.12"/>
  <circle cx="400" cy="70" r="28" fill="#ffbf47"/>
  <!-- clouds -->
  <g fill="#ffffff" fill-opacity="0.8">
    <ellipse cx="110" cy="60" rx="34" ry="12"/>
    <ellipse cx="135" cy="52" rx="22" ry="12"/>
    <ellipse cx="300" cy="44" rx="28" ry="10"/>
  </g>
  <!-- ground -->
  <rect x="10" y="250" width="460" height="60" rx="0" fill="#0b2a5b" fill-opacity="0.35"/>
  <!-- main building -->
  <g>
    <path d="M150 120 240 78l90 42z" fill="#ffffff"/>
    <rect x="160" y="120" width="160" height="130" fill="#e3edfc"/>
    <g fill="#1a4fa3">
      <rect x="175" y="135" width="10" height="100"/>
      <rect x="205" y="135" width="10" height="100"/>
      <rect x="265" y="135" width="10" height="100"/>
      <rect x="295" y="135" width="10" height="100"/>
    </g>
    <rect x="226" y="185" width="28" height="65" rx="14" fill="#0b2a5b"/>
    <circle cx="240" cy="104" r="9" fill="#ffbf47"/>
  </g>
  <!-- side buildings -->
  <g>
    <rect x="50" y="160" width="90" height="90" fill="#ffffff" fill-opacity="0.9"/>
    <g fill="#9fc1f5">
      <rect x="62" y="175" width="18" height="18"/><rect x="86" y="175" width="18" height="18"/><rect x="110" y="175" width="18" height="18"/>
      <rect x="62" y="205" width="18" height="18"/><rect x="86" y="205" width="18" height="18"/><rect x="110" y="205" width="18" height="18"/>
    </g>
    <rect x="340" y="150" width="90" height="100" fill="#ffffff" fill-opacity="0.9"/>
    <g fill="#9fc1f5">
      <rect x="352" y="165" width="18" height="18"/><rect x="376" y="165" width="18" height="18"/><rect x="400" y="165" width="18" height="18"/>
      <rect x="352" y="195" width="18" height="18"/><rect x="376" y="195" width="18" height="18"/><rect x="400" y="195" width="18" height="18"/>
    </g>
  </g>
  <!-- trees -->
  <g>
    <rect x="34" y="225" width="5" height="25" fill="#0b2a5b"/><circle cx="36" cy="218" r="14" fill="#2e9e5b"/>
    <rect x="442" y="225" width="5" height="25" fill="#0b2a5b"/><circle cx="444" cy="218" r="14" fill="#2e9e5b"/>
  </g>
  <!-- students -->
  <g>
    <circle cx="120" cy="262" r="8" fill="#ffd9b3"/><rect x="112" y="271" width="16" height="26" rx="6" fill="#ffbf47"/>
    <circle cx="150" cy="264" r="8" fill="#c68b59"/><rect x="142" y="273" width="16" height="24" rx="6" fill="#ffffff"/>
    <circle cx="340" cy="262" r="8" fill="#8d5524"/><rect x="332" y="271" width="16" height="26" rx="6" fill="#9fc1f5"/>
    <circle cx="368" cy="264" r="8" fill="#ffd9b3"/><rect x="360" y="273" width="16" height="24" rx="6" fill="#2e9e5b"/>
  </g>
</svg>
